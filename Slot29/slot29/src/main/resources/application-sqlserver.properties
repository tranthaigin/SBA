# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=sqlserver
# Prefer environment variables so credentials are never committed.
spring.datasource.url=${LIBRARY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LibraryDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${LIBRARY_DB_USER:sa}
spring.datasource.password=${LIBRARY_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
